[project]
name = "pro-autocliker"
version = "0.1.0"
description = "Desktop auto-clicker competing with OP Auto Clicker."
requires-python = ">=3.12"
dependencies = [
  "customtkinter>=6.0",
  "pynput>=1.8",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
pro-autocliker = "autoclicker.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]